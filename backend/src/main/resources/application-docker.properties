# Docker Profile Configuration
# This profile is activated when running in Docker Compose

# Server port
server.port=8080

# MongoDB Configuration (uses service name 'mongo' from docker-compose)
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo:27017/kanvas}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration (uses service name 'redis' from docker-compose)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-strong-secret}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AI Provider Configuration
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.anthropic.com/v1/messages}
app.ai.model=${AI_MODEL:claude-3-haiku-20240307}
app.ai.max-tokens=${AI_MAX_TOKENS:4096}

# Email/SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@kanvas.app}

# CORS Configuration (nginx will proxy, so allow all origins here)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Actuator / Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.kolab.kanvas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=INFO