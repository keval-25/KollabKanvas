# Application name
spring.application.name=kanvas

# Server port
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/kanvas}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-strong-secret}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes in ms
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days in ms

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AI Provider Configuration
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.anthropic.com/v1/messages}
app.ai.model=${AI_MODEL:claude-3-haiku-20240307}
app.ai.max-tokens=${AI_MAX_TOKENS:4096}

# Email/SMTP Configuration (for notifications)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@kanvas.app}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator / Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.kolab.kanvas=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=DEBUG